- name: "troubleshooting"
  description: "Comprehensive mesh troubleshooting scan across get_mesh_status, list_or_get_resources, manage_istio_config_read, analyze_ambient_policies, and get_mesh_traffic_graph. Detects: (1) Control plane & ztunnel DaemonSet/pod health, Envoy xDS desynchronization (STALE/NOT_SENT), missing sidecar injection in injection-enabled namespaces, and proxy version drift; (2) Data plane workload/service/app health, pod lifecycle failures (CrashLoopBackOff, OOMKilled, unready istio-proxy), services with 0 active endpoints, Kiali configuration validation failures, and OutOfSync ArgoCD applications; (3) Istio/Gateway API/Inference API object validation errors and warnings; (4) Security issues including un-enforced Ambient L7 policies (missing waypoint or targetRefs), partial/disabled namespace mTLS, and plaintext traffic edges; (5) Real-time traffic anomalies including failing/degraded edges, high latency spikes, and calls to BlackHoleCluster or PassthroughCluster; (6) Observability stack & connectivity issues. Optional namespace and clusterName limit the scan."
  toolset: [default, mcp]
  input_schema:
    type: "object"
    properties:
      namespace:
        type: "string"
        description: "Optional namespace to limit the error scan. If omitted, checks all accessible namespaces."
      clusterName:
        type: "string"
        description: "Optional cluster name to scan. If omitted, defaults to the cluster name in the Kiali configuration (KubeConfig)."
