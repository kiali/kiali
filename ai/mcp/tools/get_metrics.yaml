- name: "get_metrics"
  description: "Returns a compact JSON summary of Istio metrics (latency quantiles, traffic trends, throughput, payload sizes) for the given resource."
  toolset: [default, mcp]
  input_schema:
    type: "object"
    properties:
      resourceType:
        type: "string"
        description: "Type of resource to get metrics"
        enum: ["service", "workload", "app"]
      namespace:
        type: "string"
        description: "Namespace to get metrics from."
      clusterName:
        type: "string"
        description: "Cluster name to get metrics from. Optional, defaults to the cluster name in the Kiali configuration (KubeConfig)."
      resourceName:
        type: "string"
        description: "Name of the resource to get metrics for."
      step:
        type: "string"
        description: "Step between data points in seconds (e.g., '15'). Optional, defaults to 15 seconds"
      rateInterval:
        type: "string"
        description: "Rate interval for metrics (e.g., '1m', '5m'). Optional, defaults to '10m'"
      since:
        type: "string"
        description: "Start of the time range: an RFC3339 timestamp (e.g., '2026-01-02T15:04:05Z') or a duration before 'to' (e.g., '30m', '2h', '1d'). Optional, defaults to 30 minutes before 'to'"
      to:
        type: "string"
        description: "End of the time range as an RFC3339 timestamp (e.g., '2026-01-02T16:04:05Z'). Optional, defaults to now"
      direction:
        type: "string"
        description: "Traffic direction. Optional, defaults to 'outbound'"
        enum: ["inbound", "outbound"]
      reporter:
        type: "string"
        description: "Metrics reporter(s). Comma-separated list of: 'source', 'destination', 'waypoint', or the special value 'both' (no reporter filter). Optional, defaults to 'source'. Example: 'source,waypoint'"
      requestProtocol:
        type: "string"
        description: "Desired request protocol for the telemetry: For example, 'http' or 'grpc'. Optional"
      quantiles:
        type: "string"
        description: "Comma-separated list of quantiles for histogram metrics (e.g., '0.5,0.95,0.99'). Optional. Default is 0.5,0.95,0.99,0.999."
      byLabels:
        type: "string"
        description: "Comma-separated list of labels to group metrics by (e.g., 'source_workload,destination_service'). Optional"
    required: ["resourceType", "namespace", "resourceName"]
