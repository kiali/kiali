name: Nightly Build

on:
  schedule:
  # Every night at 03:30 (UTC) - offset from test-istio-version.yml (04:00) to avoid runner contention
  - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      release_branch:
        description: Branch to release
        required: true
        default: master
        type: string
      quay_repository:
        description: Quay repository
        type: string
        default: quay.io/kiali/kiali
        required: true
      run_integration_tests:
        description: Run frontend integration tests (test-istio-version runs nightly, so this is usually unnecessary)
        type: boolean
        default: false
        required: false

permissions: read-all

jobs:
  initialize:
    permissions:
      contents: read
    name: Initialize
    runs-on: ubuntu-latest
    outputs:
      build_branch: ${{ github.event.inputs.release_branch || github.ref_name }}
      quay_tag: ${{ env.quay_tag }}
      target_branch: ${{ github.event.inputs.release_branch || github.ref_name }}
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.inputs.release_branch || github.ref_name }}

    - name: Determine Quay tag
      id: quay_tag
      run: |
        if [ -z "${{ github.event.inputs.quay_repository }}" ];
        then
          QUAY_REPO="quay.io/kiali/kiali"
        else
          QUAY_REPO="${{ github.event.inputs.quay_repository }}"
        fi

        QUAY_TAG="$QUAY_REPO:latest"

        echo "quay_tag=$QUAY_TAG" >> $GITHUB_ENV

    - name: Log information
      run: |
        echo "Release type: latest"

        echo "Quay tag": ${{ env.quay_tag }}

  test_backend:
    name: Run backend linters and unit tests
    uses: ./.github/workflows/test-lint-backend.yml
    needs: [initialize]
    with:
      build_branch: ${{ github.event.inputs.release_branch || github.ref_name }}

  build_frontend:
    name: Build frontend
    uses: ./.github/workflows/build-frontend.yml
    needs: [initialize]
    with:
      target_branch: ${{needs.initialize.outputs.target_branch}}
      build_branch: ${{ github.event.inputs.release_branch || github.ref_name }}

  build_backend:
    name: Build backend
    uses: ./.github/workflows/build-backend.yml
    needs: [initialize, build_frontend, test_backend]
    with:
      build_branch: ${{ github.event.inputs.release_branch || github.ref_name }}

  push:
    permissions:
      contents: read
    name: Push latest
    # Avoid schedule workflows from forks to push images
    if: ${{ (github.event_name == 'schedule' && github.repository == 'kiali/kiali') || github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    needs: [initialize, build_backend]
    env:
      QUAY_TAG: ${{ needs.initialize.outputs.quay_tag }}
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.inputs.release_branch || github.ref_name }}

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: true
        cache-dependency-path: go.sum

    - name: Download frontend build
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: build
        path: frontend/build

    - name: Login to Quay.io
      uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
      with:
        registry: quay.io
        username: ${{ secrets.QUAY_USER }}
        password: ${{ secrets.QUAY_PASSWORD }}

    - name: Build and push image
      run: make -e DOCKER_CLI_EXPERIMENTAL=enabled build-linux-multi-arch container-multi-arch-all-push-kiali-quay

  integration_tests_frontend:
    if: ${{ inputs.run_integration_tests == true }}
    name: Run frontend integration tests
    uses: ./.github/workflows/integration-tests-frontend.yml
    needs: [initialize, build_backend]
    with:
      target_branch: ${{ needs.initialize.outputs.target_branch }}
      build_branch: ${{ needs.initialize.outputs.build_branch }}
      stern_logs: true
