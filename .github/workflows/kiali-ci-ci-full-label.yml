# Runs Kiali CI wave 2 when the ci-full label is added after the main Kiali CI
# workflow has already started (or finished). Process labels do not trigger
# Kiali CI; see kiali-ci.yml.
#
# Job names are prefixed with [ci-full] so skipped runs for other labels do not
# collide with required status checks from Kiali CI.
name: Kiali CI (ci-full label)

on:
  pull_request:
    types: [labeled]
    branches:
    - master
    - v*.*

concurrency:
  group: kiali-ci-wave2-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

permissions: read-all

jobs:
  initialize:
    permissions:
      contents: read
    name: "[ci-full] Initialize"
    if: github.event.label.name == 'ci-full'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      target-branch: ${{ github.base_ref }}
      build-branch: ${{ env.branch-pr }}
    steps:
    - run: echo "target-branch -> ${{ github.base_ref }}"
    - run: |
        echo "branch-pr=refs/pull/${{ github.ref_name }}" >> $GITHUB_ENV
        echo "build-branch -> refs/pull/${{ github.ref_name }}"

  test_backend:
    name: "[ci-full] Run backend linters and unit tests"
    uses: ./.github/workflows/test-lint-backend.yml
    needs: [initialize]
    with:
      build_branch: ${{ needs.initialize.outputs.build-branch }}

  build_frontend:
    name: "[ci-full] Build frontend"
    uses: ./.github/workflows/build-frontend.yml
    needs: [initialize]
    with:
      target_branch: ${{ needs.initialize.outputs.target-branch }}
      build_branch: ${{ needs.initialize.outputs.build-branch }}

  build_backend:
    name: "[ci-full] Build backend"
    uses: ./.github/workflows/build-backend.yml
    needs: [initialize, test_backend, build_frontend]
    with:
      build_branch: ${{ needs.initialize.outputs.build-branch }}

  integration_tests_frontend_chat:
    name: "[ci-full] Run frontend AI integration tests"
    uses: ./.github/workflows/integration-tests-frontend-chat.yml
    needs: [initialize, build_backend]
    with:
      target_branch: ${{ needs.initialize.outputs.target-branch }}
      build_branch: ${{ needs.initialize.outputs.build-branch }}

  integration_tests_frontend_local_offline:
    name: "[ci-full] Run frontend local and offline mode integration tests"
    uses: ./.github/workflows/integration-tests-frontend-local-offline.yml
    needs: [initialize, build_backend]
    with:
      target_branch: ${{ needs.initialize.outputs.target-branch }}
      build_branch: ${{ needs.initialize.outputs.build-branch }}

  integration_tests_frontend_tempo:
    name: "[ci-full] Run tracing frontend integration tests"
    uses: ./.github/workflows/integration-tests-frontend-tempo.yml
    needs: [initialize, build_backend]
    with:
      target_branch: ${{ needs.initialize.outputs.target-branch }}
      build_branch: ${{ needs.initialize.outputs.build-branch }}

  integration_tests_frontend_multicluster_primary_remote:
    name: "[ci-full] Run frontend multicluster primary-remote integration tests"
    uses: ./.github/workflows/integration-tests-frontend-multicluster-primary-remote.yml
    needs: [initialize, build_backend]
    with:
      target_branch: ${{ needs.initialize.outputs.target-branch }}
      build_branch: ${{ needs.initialize.outputs.build-branch }}

  integration_tests_frontend_multicluster_multi_primary:
    name: "[ci-full] Run frontend multicluster multi-primary integration tests"
    uses: ./.github/workflows/integration-tests-frontend-multicluster-multi-primary.yml
    needs: [initialize, build_backend]
    with:
      target_branch: ${{ needs.initialize.outputs.target-branch }}
      build_branch: ${{ needs.initialize.outputs.build-branch }}

  integration_tests_frontend_multicluster_external_kiali:
    name: "[ci-full] Run frontend multicluster external-kiali integration tests"
    uses: ./.github/workflows/integration-tests-frontend-multicluster-external-kiali.yml
    needs: [initialize, build_backend]
    with:
      target_branch: ${{ needs.initialize.outputs.target-branch }}
      build_branch: ${{ needs.initialize.outputs.build-branch }}

  integration_tests_frontend_multi_mesh:
    name: "[ci-full] Run frontend multi mesh integration tests"
    uses: ./.github/workflows/integration-tests-frontend-multi-mesh.yml
    needs: [initialize, build_backend]
    with:
      target_branch: ${{ needs.initialize.outputs.target-branch }}
      build_branch: ${{ needs.initialize.outputs.build-branch }}

  integration_tests_backend_multicluster_external_controlplane:
    name: "[ci-full] Run backend multicluster external-controlplane integration tests"
    uses: ./.github/workflows/integration-tests-backend-multicluster-external-controlplane.yml
    needs: [initialize, build_backend]
    with:
      target_branch: ${{ needs.initialize.outputs.target-branch }}
      build_branch: ${{ needs.initialize.outputs.build-branch }}
