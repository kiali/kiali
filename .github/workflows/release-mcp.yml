name: Release MCP

# Builds the Kiali image from a release branch and publishes it to
# quay.io/kiali/kiali_mcp. Versioning is derived from existing Quay tags for
# that branch line (e.g. v2.27 -> next patch v2.27.N). Tags pushed:
#   - vX.Y.Z-<git-sha>    (immutable/traceable release version with short git sha)
#   - vX.Y                (floating minor/branch line — overwrites on each publish)
#
# After publish (or with skip_publication=true), optionally validates the Kiali
# version pinned by the selected kubernetes-mcp-server ref (build/kiali.mk →
# quay.io/kiali/kiali_mcp:<pin>) using tests/integration/mcp_tools.
# Validate-only (skip_publication=true) is blocking. After a successful publish,
# validation is non-blocking so a pin check failure does not fail the release.

on:
  workflow_dispatch:
    inputs:
      release_branch:
        description: Release branch to publish from (e.g. v2.27)
        required: true
        default: v2.27
        type: choice
        options:
        - v2.27
        - v2.22
      skip_publication:
        description: Skip pushing to Quay (run MCP pin validation only)
        required: false
        type: boolean
        default: false
      kubernetes_mcp_server_ref:
        description: MCP server git ref whose Kiali/Istio pins are used for validation (default main)
        required: false
        type: string
        default: main
      run_validation:
        description: Run mcp_tools against the MCP pin (blocking if skip_publication; non-blocking after publish)
        required: false
        type: boolean
        default: true

permissions: read-all

env:
  KIALI_IMAGE_NAME: quay.io/kiali/kiali_mcp

jobs:
  initialize:
    permissions:
      contents: read
    name: Initialize
    runs-on: ubuntu-latest
    outputs:
      release_branch: ${{ steps.versions.outputs.release_branch }}
      release_version: ${{ steps.versions.outputs.release_version }}
      quay_name: ${{ steps.versions.outputs.quay_name }}
      quay_tag: ${{ steps.versions.outputs.quay_tag }}
      git_sha: ${{ steps.versions.outputs.git_sha }}
      skip_publication: ${{ steps.versions.outputs.skip_publication }}
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.inputs.release_branch }}

    - name: Determine next Quay version
      id: versions
      env:
        RELEASE_BRANCH: ${{ github.event.inputs.release_branch }}
        QUAY_REPOSITORY: quay.io/kiali/kiali_mcp
        SKIP_PUBLICATION: ${{ github.event.inputs.skip_publication }}
      run: |
        set -euo pipefail

        if [[ ! "${RELEASE_BRANCH}" =~ ^v[0-9]+\.[0-9]+$ ]]; then
          echo "release_branch must match vX.Y (got: ${RELEASE_BRANCH})"
          exit 1
        fi

        # quay.io/org/repo -> org/repo for the Quay API
        QUAY_PATH="${QUAY_REPOSITORY#quay.io/}"

        GIT_SHA="$(git rev-parse --short=7 HEAD)"

        cat <<-EOF > next_version.py
        import json
        import re
        import sys
        import urllib.error
        import urllib.request

        branch = sys.argv[1]
        quay_path = sys.argv[2]
        # Match bare vX.Y.Z and sha-suffixed vX.Y.Z-<sha> (and any -suffix)
        pattern = re.compile(rf"^{re.escape(branch)}\.(\d+)(-|$)")

        tags = []
        page = 1
        while True:
            url = (
                f"https://quay.io/api/v1/repository/{quay_path}/tag/"
                f"?page={page}&limit=100&onlyActiveTags=true"
            )
            try:
                with urllib.request.urlopen(url) as resp:
                    payload = json.load(resp)
            except urllib.error.HTTPError as err:
                if err.code == 404:
                    payload = {"tags": [], "has_additional": False}
                else:
                    raise

            tags.extend(t.get("name", "") for t in payload.get("tags", []))
            if not payload.get("has_additional"):
                break
            page += 1

        max_patch = -1
        for name in tags:
            match = pattern.match(name)
            if match:
                max_patch = max(max_patch, int(match.group(1)))

        next_patch = 0 if max_patch < 0 else max_patch + 1
        print(f"{branch}.{next_patch}")
        EOF

        RELEASE_VERSION="$(python next_version.py "${RELEASE_BRANCH}" "${QUAY_PATH}")"
        TRACE_TAG="${RELEASE_VERSION}-${GIT_SHA}"
        QUAY_TAG="${QUAY_REPOSITORY}:${TRACE_TAG} ${QUAY_REPOSITORY}:${RELEASE_BRANCH}"

        {
          echo "release_branch=${RELEASE_BRANCH}"
          echo "release_version=${RELEASE_VERSION}"
          echo "git_sha=${GIT_SHA}"
          echo "quay_name=${QUAY_REPOSITORY}"
          echo "quay_tag=${QUAY_TAG}"
          echo "skip_publication=${SKIP_PUBLICATION}"
        } >> "${GITHUB_OUTPUT}"

        {
          echo "### Release MCP"
          echo ""
          echo "| | |"
          echo "|---|---|"
          echo "| Branch | \`${RELEASE_BRANCH}\` |"
          echo "| Commit | \`${GIT_SHA}\` |"
          echo "| Version | \`${RELEASE_VERSION}\` |"
          echo "| Trace tag | \`${TRACE_TAG}\` |"
          echo "| Branch tag | \`${RELEASE_BRANCH}\` |"
          echo "| Quay | \`${QUAY_REPOSITORY}\` |"
          echo "| Skip publication | \`${SKIP_PUBLICATION}\` |"
          echo "| MCP ref (validation) | \`${{ github.event.inputs.kubernetes_mcp_server_ref }}\` |"
        } >> "${GITHUB_STEP_SUMMARY}"

        echo "Release branch: ${RELEASE_BRANCH}"
        echo "Git SHA: ${GIT_SHA}"
        echo "Release version: ${RELEASE_VERSION}"
        echo "Quay tags: ${QUAY_TAG}"
        echo "Skip publication: ${SKIP_PUBLICATION}"

        rm -f next_version.py

  build_frontend:
    name: Build frontend
    if: ${{ github.event.inputs.skip_publication != 'true' }}
    uses: ./.github/workflows/build-frontend.yml
    needs: [initialize]
    with:
      target_branch: ${{ needs.initialize.outputs.release_branch }}
      build_branch: ${{ needs.initialize.outputs.release_branch }}

  build_backend:
    name: Build backend
    if: ${{ github.event.inputs.skip_publication != 'true' }}
    uses: ./.github/workflows/build-backend.yml
    needs: [initialize, build_frontend]
    with:
      build_branch: ${{ needs.initialize.outputs.release_branch }}

  publish:
    permissions:
      contents: read
    name: Build and push image
    if: ${{ github.event.inputs.skip_publication != 'true' }}
    runs-on: ubuntu-latest
    needs: [initialize, build_backend]
    env:
      QUAY_NAME: ${{ needs.initialize.outputs.quay_name }}
      QUAY_TAG: ${{ needs.initialize.outputs.quay_tag }}
      RELEASE_VERSION: ${{ needs.initialize.outputs.release_version }}
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ needs.initialize.outputs.release_branch }}

    - name: Set version for image build
      run: |
        # Embed the calculated Quay release version in the binary (do not commit).
        sed -i -r "s/^VERSION \?= (.*)/VERSION \?= $RELEASE_VERSION/" Makefile

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: true
        cache-dependency-path: go.sum

    - name: Download frontend build
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: build
        path: frontend/build

    - name: Login to Quay.io
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: quay.io
        username: ${{ secrets.QUAY_USER }}
        password: ${{ secrets.QUAY_PASSWORD }}

    # QUAY_NAME/QUAY_TAG override Makefile defaults (CONTAINER_NAME/kiali).
    - name: Build and push image
      run: |
        make -e DOCKER_CLI_EXPERIMENTAL=enabled \
          QUAY_NAME="${QUAY_NAME}" \
          QUAY_TAG="${QUAY_TAG}" \
          build-linux-multi-arch container-multi-arch-all-push-kiali-quay

    - name: Summarize published tags
      run: |
        {
          echo "### Published tags"
          echo ""
          echo "Image version \`${RELEASE_VERSION}\` pushed with:"
          echo ""
          for tag in ${QUAY_TAG}; do
            echo "- \`${tag}\`"
          done
        } >> "${GITHUB_STEP_SUMMARY}"

  validate:
    permissions:
      contents: read
    name: Validate MCP pin
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [initialize, publish]
    # Blocking for validate-only; non-blocking after a successful publish.
    continue-on-error: ${{ github.event.inputs.skip_publication != 'true' }}
    # Run when validation is enabled and either publish succeeded or was skipped.
    if: >-
      always() &&
      github.event.inputs.run_validation != 'false' &&
      needs.initialize.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    env:
      CI: 1
      TERM: xterm
      KUBERNETES_MCP_SERVER_REF: ${{ github.event.inputs.kubernetes_mcp_server_ref || 'main' }}
    steps:
    # Checkout the workflow SHA (not release_branch) so hack scripts / mcp_tools
    # match this PR even when publishing an older release line.
    - name: Check out Kiali code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Install Helm
      uses: Azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      with:
        version: 'v3.18.4'

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: true
        cache-dependency-path: go.sum

    - name: Check out kubernetes-mcp-server (pin + endpoints)
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        repository: containers/kubernetes-mcp-server
        path: kubernetes-mcp-server
        ref: ${{ env.KUBERNETES_MCP_SERVER_REF }}
        sparse-checkout: |
          build/kiali.mk
          pkg/toolsets/kiali/tools/endpoints.go
        sparse-checkout-cone-mode: false

    - name: Resolve pins from kubernetes-mcp-server
      id: pins
      working-directory: kubernetes-mcp-server
      run: |
        set -euo pipefail
        KIALI_VERSION=$(grep -E '^KIALI_VERSION' build/kiali.mk | awk -F= '{print $2}' | tr -d '[:space:]')
        ISTIO_VERSION=$(grep -E '^ISTIO_VERSION' build/kiali.mk | awk -F= '{print $2}' | tr -d '[:space:]')

        if [ -z "${KIALI_VERSION}" ]; then
          echo "ERROR: KIALI_VERSION not found in build/kiali.mk" >&2
          exit 1
        fi

        {
          echo "kiali_version=${KIALI_VERSION}"
          echo "istio_version=${ISTIO_VERSION}"
        } >> "${GITHUB_OUTPUT}"

        {
          echo "### MCP pin validation"
          echo ""
          echo "| | |"
          echo "|---|---|"
          echo "| MCP ref | \`${KUBERNETES_MCP_SERVER_REF}\` |"
          echo "| Image | \`${KIALI_IMAGE_NAME}:${KIALI_VERSION}\` |"
          echo "| ISTIO_VERSION pin | \`${ISTIO_VERSION}\` |"
          echo "| Test suite | \`tests/integration/mcp_tools\` |"
        } >> "${GITHUB_STEP_SUMMARY}"

        echo "Will deploy ${KIALI_IMAGE_NAME}:${KIALI_VERSION} from MCP ref ${KUBERNETES_MCP_SERVER_REF}"

    - name: Check mcp_tools endpoint coverage
      id: coverage
      run: |
        chmod +x hack/mcp/check-mcp-endpoint-coverage.sh
        hack/mcp/check-mcp-endpoint-coverage.sh kubernetes-mcp-server tests/integration/mcp_tools

    - name: Setup cluster and run mcp_tools tests
      id: mcpTests
      env:
        KIALI_VERSION: ${{ steps.pins.outputs.kiali_version }}
        ISTIO_VERSION: ${{ steps.pins.outputs.istio_version }}
      run: |
        set -euo pipefail
        ISTIO_ARGS=""
        if [ -n "${ISTIO_VERSION}" ]; then
          ISTIO_ARGS="--istio-version ${ISTIO_VERSION}"
        fi
        echo "Deploying ${KIALI_IMAGE_NAME}:${KIALI_VERSION} and running mcp_tools tests"
        hack/run-integration-tests.sh \
          --test-suite backend \
          --mcp-tools true \
          --kiali-version "${KIALI_VERSION}" \
          --kiali-image-name "${KIALI_IMAGE_NAME}" \
          ${ISTIO_ARGS}

    - name: Get debug info when tests fail
      if: ${{ failure() && (steps.mcpTests.conclusion == 'failure' || steps.coverage.conclusion == 'failure') }}
      run: |
        mkdir -p debug-output
        hack/ci-get-debug-info.sh --output-directory debug-output || true

    - name: Upload debug info artifact
      if: ${{ failure() && (steps.mcpTests.conclusion == 'failure' || steps.coverage.conclusion == 'failure') }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: debug-info-release-mcp-validate
        path: debug-output

    - name: Upload mcp_tools junit
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: junit-rest-report-release-mcp-validate
        path: tests/integration/junit-rest-report-mcp-tools.xml
        if-no-files-found: warn
