name: Integration Tests Frontend Chat

on:
  workflow_call:
    inputs:
      target_branch:
        required: true
        type: string
      build_branch:
        required: true
        type: string
      istio_version:
        required: false
        type: string
        default: ""
      stern_logs:
        required: false
        type: boolean
        default: false
      sail:
        description: "If true, install Istio with Sail. If false, use istioctl (supports Istio RCs)."
        required: false
        type: string
        default: "true"

env:
  TARGET_BRANCH: ${{ inputs.target_branch }}
  BUILD_BRANCH: ${{ inputs.build_branch || inputs.target_branch }}

jobs:
  integration_tests_frontend_chat:
    name: Integration AI Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: 1
      TERM: xterm
    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.build_branch }}

    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        docker system prune -af --volumes

    - name: Start resource sampler
      run: nohup nice -n 19 bash hack/ci-resource-sampler.sh start --csv /tmp/ci-telemetry-frontend-chat.csv > /tmp/sampler.out 2>&1 &
      continue-on-error: true

    - name: Install Helm
      uses: Azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      with:
        version: 'v3.18.4'

    - name: Enable corepack
      run: corepack enable

    - name: Setup node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "24"
        cache: yarn
        cache-dependency-path: frontend/yarn.lock

    - name: Download go binary
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: kiali
        path: ~/go/bin/

    - name: Ensure kiali binary is executable
      run: chmod +x ~/go/bin/kiali

    - name: Install frontend dependencies
      working-directory: ./frontend
      run: yarn install --immutable

    - name: Run frontend chat integration tests
      run: hack/run-integration-tests.sh --test-suite ai-chatbot --stern ${{ inputs.stern_logs }} $(if [ -n "${{ inputs.istio_version }}" ]; then echo "--istio-version ${{ inputs.istio_version }}"; fi) $(if [ -n "${{ inputs.sail }}" ]; then echo "--sail ${{ inputs.sail }}"; fi)

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: junit-frontend-chat-report
        path: frontend/cypress/results/combined-report.xml
        if-no-files-found: warn

    - name: Stop resource sampler
      if: always()
      run: bash hack/ci-resource-sampler.sh stop --csv /tmp/ci-telemetry-frontend-chat.csv || true
      continue-on-error: true

    - name: Upload resource telemetry
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      continue-on-error: true
      with:
        name: resource-telemetry-frontend-chat
        path: /tmp/ci-telemetry-frontend-chat.csv
        retention-days: 14
        if-no-files-found: ignore

    - name: Get debug info when integration tests fail
      if: failure()
      run: |
        mkdir debug-output
        hack/ci-get-debug-info.sh --output-directory debug-output

    - name: Upload debug info artifact
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: debug-info-frontend-chat
        path: debug-output

    - name: Upload cypress screenshots when tests fail
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: failure()
      with:
        name: cypress-screenshots-frontend-chat
        path: frontend/cypress/screenshots

    - name: Upload cypress logs from stern
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: ${{ inputs.stern_logs == true }}
      with:
        name: cypress-logs-frontend-chat
        path: hack/stern
