name: Test Istio Version

on:
  schedule:
  # These are in UTC time.
  # If you change any of these, you must also change the case statement in the determine-* tasks below.
  - cron: "0 2 * * *"
  - cron: "0 4 * * *"
  - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      istio_version:
        description: "istio_version: The version of Istio to test with. Format is either #.#.# or #.#-dev. If specified, this overrides istio_minor_version_offset."
        required: false
        default: ""
        type: string
      istio_minor_version_offset:
        description: "istio_minor_version_offset: If istio_version is not set, by default the latest Istio minor version is tested. To test the previous minor version, set this offset to 1 (i.e. 1 minor version prior to the latest minor version). Set it to 2 for two minor versions previous to the latest. This setting is ignored if istio_version is set."
        required: false
        default: 0
        type: number
      branch_to_test:
        description: "branch_to_test: The branch to build and test."
        required: true
        default: "master"
        type: string
      sail_operator_git_ref:
        description: "sail_operator_git_ref: Optional Sail operator git ref (for example 'main'). If set, it overrides schedule defaults."
        required: false
        default: ""
        type: string

permissions: read-all

jobs:
  initialize:
    permissions:
      contents: read
    name: Initialize
    runs-on: ubuntu-latest
    outputs:
      target-branch: ${{ inputs.branch_to_test }}
      build-branch: ${{ inputs.branch_to_test }}
      istio-version: ${{ steps.determine-istio-version-to-use.outputs.istio-version }}
      sail-operator-git-ref: ${{ steps.determine-sail-operator-git-ref-to-use.outputs.sail-operator-git-ref }}
    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.branch_to_test || github.ref_name }}
    - name: Determine Sail Operator git ref to use
      id: determine-sail-operator-git-ref-to-use
      run: |
        if [ -n "${{ github.event.inputs.sail_operator_git_ref }}" ]; then
          SAIL_OPERATOR_GIT_REF="${{ github.event.inputs.sail_operator_git_ref }}"
        else
          case "${{ github.event.schedule }}" in
            "0 6 * * *") SAIL_OPERATOR_GIT_REF="main" ;;
            *) SAIL_OPERATOR_GIT_REF="" ;;
          esac
        fi
        echo "sail-operator-git-ref=${SAIL_OPERATOR_GIT_REF}" | tee -a "$GITHUB_OUTPUT"
    - name: Determine Istio Version to use
      id: determine-istio-version-to-use
      run: |
        if [ -z "${{ github.event.inputs.istio_version }}" ]; then
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.istio_minor_version_offset }}" ]]; then
            OFFSET="${{ github.event.inputs.istio_minor_version_offset }}"
            # Convert to absolute value - we want a positive offset, though some people might find it more intuitive to say "-1" offset for the previous version
            OFFSET=$(( OFFSET < 0 ? -OFFSET : OFFSET ))
          else
            case "${{ github.event.schedule }}" in
              "0 6 * * *") OFFSET=0 ;;
              "0 2 * * *") OFFSET=1 ;;
              "0 4 * * *") OFFSET=2 ;;
              *) echo "Invalid schedule or unknown trigger! Cannot determine Istio version." && exit 1 ;;
            esac
          fi
          VERSION_SOURCE="sail"
          ISTIO_VERSION="$(bash ./hack/istio/determine-test-istio-version.sh --source "${VERSION_SOURCE}" --offset "${OFFSET}")"
          echo "Resolved Istio version from source '${VERSION_SOURCE}' with offset [${OFFSET}]: ${ISTIO_VERSION}"
        else
          ISTIO_VERSION="${{ github.event.inputs.istio_version }}"
        fi
        echo "istio-version=${ISTIO_VERSION}" | tee -a "$GITHUB_OUTPUT"
    - run: echo "target-branch -> ${{ inputs.branch_to_test }}"
    - run: echo "build-branch -> ${{ inputs.branch_to_test }}"
    - run: echo "sail-operator-git-ref -> ${{ steps.determine-sail-operator-git-ref-to-use.outputs.sail-operator-git-ref }}"

  test_backend:
    name: Run backend linters and unit tests
    uses: ./.github/workflows/test-lint-backend.yml
    needs: [initialize]
    with:
      build_branch: ${{ needs.initialize.outputs.build-branch }}

  build_frontend:
    name: Build frontend
    uses: ./.github/workflows/build-frontend.yml
    needs: [initialize]
    with:
      target_branch: ${{ needs.initialize.outputs.target-branch }}
      build_branch: ${{ needs.initialize.outputs.build-branch }}

  build_backend:
    name: Build backend
    uses: ./.github/workflows/build-backend.yml
    needs: [initialize, test_backend, build_frontend]
    with:
      build_branch: ${{ needs.initialize.outputs.build-branch }}

  integration_tests_backend:
    name: Run backend integration tests
    uses: ./.github/workflows/integration-tests-backend.yml
    needs: [initialize, build_backend]
    with:
      target_branch: ${{ needs.initialize.outputs.target-branch }}
      build_branch: ${{ needs.initialize.outputs.build-branch }}
      istio_version: ${{ needs.initialize.outputs.istio-version }}
      sail_operator_git_ref: ${{ needs.initialize.outputs.sail-operator-git-ref }}

  integration_tests_backend_multicluster_external_controlplane:
    name: Run backend multicluster external-controlplane integration tests
    uses: ./.github/workflows/integration-tests-backend-multicluster-external-controlplane.yml
    needs: [initialize, build_backend]
    with:
      target_branch: ${{ needs.initialize.outputs.target-branch }}
      build_branch: ${{ needs.initialize.outputs.build-branch }}
      istio_version: ${{ needs.initialize.outputs.istio-version }}
      sail_operator_git_ref: ${{ needs.initialize.outputs.sail-operator-git-ref }}

  integration_tests_frontend:
    name: Run frontend integration tests
    uses: ./.github/workflows/integration-tests-frontend.yml
    needs: [initialize, build_backend]
    with:
      target_branch: ${{ needs.initialize.outputs.target-branch }}
      build_branch: ${{ needs.initialize.outputs.build-branch }}
      istio_version: ${{ needs.initialize.outputs.istio-version }}
      sail_operator_git_ref: ${{ needs.initialize.outputs.sail-operator-git-ref }}

  integration_tests_frontend_multicluster_primary_remote:
    name: Run frontend multicluster primary-remote integration tests
    uses: ./.github/workflows/integration-tests-frontend-multicluster-primary-remote.yml
    needs: [initialize, build_backend]
    with:
      target_branch: ${{ needs.initialize.outputs.target-branch }}
      build_branch: ${{ needs.initialize.outputs.build-branch }}
      istio_version: ${{ needs.initialize.outputs.istio-version }}
      sail_operator_git_ref: ${{ needs.initialize.outputs.sail-operator-git-ref }}

  integration_tests_frontend_multicluster_multi_primary:
    name: Run frontend multicluster multi-primary integration tests
    uses: ./.github/workflows/integration-tests-frontend-multicluster-multi-primary.yml
    needs: [initialize, build_backend]
    with:
      target_branch: ${{ needs.initialize.outputs.target-branch }}
      build_branch: ${{ needs.initialize.outputs.build-branch }}
      istio_version: ${{ needs.initialize.outputs.istio-version }}
      sail_operator_git_ref: ${{ needs.initialize.outputs.sail-operator-git-ref }}

  integration_tests_frontend_ambient:
    name: Run Ambient frontend integration tests
    uses: ./.github/workflows/integration-tests-frontend-ambient.yml
    needs: [initialize, build_backend]
    if: ${{ needs.initialize.outputs.istio-version >= '1.23' }}
    with:
      target_branch: ${{ needs.initialize.outputs.target-branch }}
      build_branch: ${{ needs.initialize.outputs.build-branch }}
      istio_version: ${{ needs.initialize.outputs.istio-version }}
      sail_operator_git_ref: ${{ needs.initialize.outputs.sail-operator-git-ref }}

  integration_tests_frontend_tempo:
    name: Run tracing frontend integration tests
    uses: ./.github/workflows/integration-tests-frontend-tempo.yml
    needs: [initialize, build_backend]
    with:
      target_branch: ${{ needs.initialize.outputs.target-branch }}
      build_branch: ${{ needs.initialize.outputs.build-branch }}
      istio_version: ${{ needs.initialize.outputs.istio-version }}
      sail_operator_git_ref: ${{ needs.initialize.outputs.sail-operator-git-ref }}

  integration_tests_backend_mcp:
    name: Run backend MCP integration tests
    uses: ./.github/workflows/integration-tests-backend-mcp.yml
    needs: [initialize, build_backend]
    with:
      target_branch: ${{ needs.initialize.outputs.target-branch }}
      build_branch: ${{ needs.initialize.outputs.build-branch }}
      istio_version: ${{ needs.initialize.outputs.istio-version }}

  integration_tests_frontend_ambient_multi_primary:
    name: Run frontend Ambient Multi-Primary integration tests
    uses: ./.github/workflows/integration-tests-frontend-ambient-multi-primary.yml
    needs: [initialize, build_backend]
    with:
      target_branch: ${{ needs.initialize.outputs.target-branch }}
      build_branch: ${{ needs.initialize.outputs.build-branch }}
      istio_version: ${{ needs.initialize.outputs.istio-version }}

  integration_tests_frontend_chat:
    name: Run frontend AI integration tests
    uses: ./.github/workflows/integration-tests-frontend-chat.yml
    needs: [initialize, build_backend]
    with:
      target_branch: ${{ needs.initialize.outputs.target-branch }}
      build_branch: ${{ needs.initialize.outputs.build-branch }}
      istio_version: ${{ needs.initialize.outputs.istio-version }}

  integration_tests_frontend_local_offline:
    name: Run frontend local and offline mode integration tests
    uses: ./.github/workflows/integration-tests-frontend-local-offline.yml
    needs: [initialize, build_backend]
    with:
      target_branch: ${{ needs.initialize.outputs.target-branch }}
      build_branch: ${{ needs.initialize.outputs.build-branch }}
      istio_version: ${{ needs.initialize.outputs.istio-version }}

  integration_tests_frontend_multicluster_external_kiali:
    name: Run frontend multicluster external-kiali integration tests
    uses: ./.github/workflows/integration-tests-frontend-multicluster-external-kiali.yml
    needs: [initialize, build_backend]
    with:
      target_branch: ${{ needs.initialize.outputs.target-branch }}
      build_branch: ${{ needs.initialize.outputs.build-branch }}
      istio_version: ${{ needs.initialize.outputs.istio-version }}

  integration_tests_frontend_multi_mesh:
    name: Run frontend multi mesh integration tests
    uses: ./.github/workflows/integration-tests-frontend-multi-mesh.yml
    needs: [initialize, build_backend]
    with:
      target_branch: ${{ needs.initialize.outputs.target-branch }}
      build_branch: ${{ needs.initialize.outputs.build-branch }}
      istio_version: ${{ needs.initialize.outputs.istio-version }}

  codecov_merge_upload:
    if: |
      always() &&
      (github.event.schedule == '0 6 * * *' || github.event_name == 'workflow_dispatch') &&
      needs.integration_tests_backend.result == 'success' &&
      needs.test_backend.result == 'success'
    name: Merge and Upload Coverage to Codecov
    needs:
    - initialize
    - integration_tests_backend
    - integration_tests_backend_multicluster_external_controlplane
    - test_backend
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        ref: ${{ needs.initialize.outputs.build-branch }}

    - name: Download unit coverage
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: coverage-unit
        path: coverage

    - name: Download backend coverage
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: coverage-backend
        path: coverage

    - name: Download multicluster coverage
      if: needs.integration_tests_backend_multicluster_external_controlplane.result == 'success'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: coverage-multicluster
        path: coverage

    - name: Merge coverage files
      run: |
        echo "mode: set" > coverage.out
        grep -h -v "^mode:" coverage/coverage-unit.out >> coverage.out
        grep -h -v "^mode:" coverage/coverage-backend.out >> coverage.out
        if [ -f coverage/coverage-multicluster.out ]; then
          grep -h -v "^mode:" coverage/coverage-multicluster.out >> coverage.out
        fi

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        disable_search: true
        fail_ci_if_error: true
        files: coverage.out
        flags: integration
        override_branch: ${{ needs.initialize.outputs.build-branch }}
        slug: kiali/kiali
        token: ${{ secrets.CODECOV_TOKEN }}
        use_pypi: true
