# Local Kiali config for Playwright @tracing / Tempo CI (mirrors frontend-tempo Helm values).
additional_display_details:
- annotation: kiali.io/api-spec
  icon_annotation: kiali.io/api-type
  title: API Documentation
external_services:
  grafana:
    enabled: true
    # Required for Tempo "View in Tracing" (default url_format uses Grafana).
    # Matches setup_kind_tempo Helm: external_services.grafana.external_url.
    external_url: http://grafana.istio-system:3000
    # Overwritten by --port-forward-grafana to a local port.
    internal_url: http://grafana.istio-system:3000
  tracing:
    enabled: true
    # InternalURL is overwritten by --port-forward-tracing to the local Tempo frontend port.
    external_url: http://tempo-cr-query-frontend.tempo:3200
    internal_url: http://tempo-cr-query-frontend.tempo:3200
    provider: tempo
    use_grpc: false
health_config:
  rate:
  - kind: service
    name: y-server
    namespace: alpha
    tolerance:
    - code: 5xx
      degraded: 2
      failure: 100
kiali_internal:
  graph_cache:
    enabled: false
  health_cache:
    enabled: false
