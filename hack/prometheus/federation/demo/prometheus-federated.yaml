# Demo lab: Federated Prometheus deployment (long-retention TSDB Kiali queries).
# Federation match[] selectors are merged at render time from core-federation-match.yml
# (always) and optional *-federation-match.yml tiers.
#
# Render with: demo/render-prometheus-federated.py (or demo/install.sh)
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-federated
  namespace: istio-system
  labels:
    app: prometheus-federated
data:
  prometheus.yml: |
    global:
      evaluation_interval: 1m
      scrape_interval: 30s
      scrape_timeout: 25s
    scrape_configs:
    - job_name: istio-prometheus-federate
      # Required: preserve Istio labels from edge (avoid exported_* renames on conflict)
      honor_labels: true
      metrics_path: /federate
      scrape_interval: 30s
      scrape_timeout: 25s
      params:
        match[]: []
      metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'workload:(.*)'
        target_label: __name__
        action: replace
      static_configs:
      - targets:
        - prometheus.istio-system.svc.cluster.local:9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-federated
  namespace: istio-system
  labels:
    app: prometheus-federated
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus-federated
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: prometheus-federated
        sidecar.istio.io/inject: "false"
    spec:
      containers:
      - name: prometheus
        image: docker.io/prom/prometheus:v3.10.0
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/data
        - --storage.tsdb.retention.time=15d
        - --web.enable-lifecycle
        ports:
        - containerPort: 9090
          name: http
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
        - name: data
          mountPath: /data
        readinessProbe:
          httpGet:
            path: /-/ready
            port: 9090
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: 9090
          initialDelaySeconds: 30
          periodSeconds: 15
      volumes:
      - name: config
        configMap:
          name: prometheus-federated
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-federated
  namespace: istio-system
  labels:
    app: prometheus-federated
spec:
  selector:
    app: prometheus-federated
  ports:
  - name: http
    port: 9090
    targetPort: 9090
