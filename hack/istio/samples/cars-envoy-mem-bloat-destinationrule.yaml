# Cars Envoy memory warning demo overlay (travel-agency).
#
# Creates 7 DestinationRules with 20 subsets each (140 subsets
# total) so the cars-v1 sidecar exceeds Kiali's large-config cluster threshold (100).
# A tight istio-proxy memory limit on cars-v1 makes memory status exceed the 70% limit threshold.
#
# Prerequisites: travel-agency demo installed (install-travel-agency-demo.sh).
#
# Apply Istio config:
#   kubectl apply -f hack/istio/samples/cars-envoy-mem-bloat-destinationrule.yaml
#
# Tighten proxy memory on cars-v1 only (does not affect other travel-agency workloads):
#   kubectl patch deploy cars-v1 -n travel-agency --type=merge -p '{"spec":{"template":{"metadata":{"annotations":{"sidecar.istio.io/proxyMemory":"32Mi","sidecar.istio.io/proxyMemoryLimit":"88Mi","demo.kiali.io/envoy-memory-bloat":"true"}}}}}'
#   kubectl rollout status deploy/cars-v1 -n travel-agency
#
# Remove:
#   kubectl delete -f hack/istio/samples/cars-envoy-mem-bloat-destinationrule.yaml
#   kubectl patch deploy cars-v1 -n travel-agency --type=merge -p '{"spec":{"template":{"metadata":{"annotations":{"sidecar.istio.io/proxyMemory":"128Mi","sidecar.istio.io/proxyMemoryLimit":"512Mi"}}}}}'
#

apiVersion: networking.istio.io/v1
kind: DestinationRule
