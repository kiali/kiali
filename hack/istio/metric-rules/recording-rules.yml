# Recording rules for Istio traffic metrics required by Kiali.
# See kiali-required-metrics.yml and https://kiali.io/docs/faq/general/#requiredmetrics
#
# Produces workload:<metric> series on the edge Prometheus for federation.
# Rule group interval should be >= edge scrape_interval, up to 2x scrape_interval.
# With 30s scrape, use interval: 30s (see kiali.io Prometheus tuning docs).
# Control plane, container, process, envoy, and istio_build metrics are NOT
# recorded here — they are federated directly from the edge Prometheus.

groups:
- name: istio.workload-aggregation
  interval: 30s
  rules:
  - record: workload:istio_requests_total
    expr: sum without (pod, instance, namespace, job, node) (istio_requests_total)

  - record: workload:istio_request_messages_total
    expr: sum without (pod, instance, namespace, job, node) (istio_request_messages_total)

  - record: workload:istio_response_messages_total
    expr: sum without (pod, instance, namespace, job, node) (istio_response_messages_total)

  - record: workload:istio_tcp_sent_bytes_total
    expr: sum without (pod, instance, namespace, job, node) (istio_tcp_sent_bytes_total)

  - record: workload:istio_tcp_received_bytes_total
    expr: sum without (pod, instance, namespace, job, node) (istio_tcp_received_bytes_total)

  - record: workload:istio_tcp_connections_opened_total
    expr: sum without (pod, instance, namespace, job, node) (istio_tcp_connections_opened_total)

  - record: workload:istio_tcp_connections_closed_total
    expr: sum without (pod, instance, namespace, job, node) (istio_tcp_connections_closed_total)

  - record: workload:istio_request_duration_milliseconds_bucket
    expr: sum without (pod, instance, namespace, job, node) (istio_request_duration_milliseconds_bucket)

  - record: workload:istio_request_duration_milliseconds_sum
    expr: sum without (pod, instance, namespace, job, node) (istio_request_duration_milliseconds_sum)

  - record: workload:istio_request_duration_milliseconds_count
    expr: sum without (pod, instance, namespace, job, node) (istio_request_duration_milliseconds_count)

  - record: workload:istio_request_bytes_bucket
    expr: sum without (pod, instance, namespace, job, node) (istio_request_bytes_bucket)

  - record: workload:istio_request_bytes_sum
    expr: sum without (pod, instance, namespace, job, node) (istio_request_bytes_sum)

  - record: workload:istio_request_bytes_count
    expr: sum without (pod, instance, namespace, job, node) (istio_request_bytes_count)

  - record: workload:istio_response_bytes_bucket
    expr: sum without (pod, instance, namespace, job, node) (istio_response_bytes_bucket)

  - record: workload:istio_response_bytes_sum
    expr: sum without (pod, instance, namespace, job, node) (istio_response_bytes_sum)

  - record: workload:istio_response_bytes_count
    expr: sum without (pod, instance, namespace, job, node) (istio_response_bytes_count)
