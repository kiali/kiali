  dashboard-performance.json: |
    {"kind":"Dashboard","metadata":{"name":"istio-performance","createdAt":"0001-01-01T00:00:00Z","updatedAt":"0001-01-01T00:00:00Z","version":0,"project":"istio"},"spec":{"display":{"name":"Istio Performance Dashboard"},"panels":{"0_0":{"kind":"Panel","spec":{"display":{"name":"Performance Dashboard README"},"plugin":{"kind":"Markdown","spec":{"text":"The charts on this dashboard are intended to show Istio main components cost in terms of resources utilization under steady load.\n\n- **vCPU / 1k rps:** shows vCPU utilization by the main Istio components normalized by 1000 requests/second. When idle or low traffic, this chart will be blank. The curve for istio-proxy refers to the services sidecars only.\n- **vCPU:** vCPU utilization by Istio components, not normalized.\n- **Memory:** memory footprint for the components. Telemetry and policy are normalized by 1k rps, and no data is shown  when there is no traffic. For ingress and istio-proxy, the data is per instance.\n- **Bytes transferred / sec:** shows the number of bytes flowing through each Istio component.\n\n\n"}}}},"1_0":{"kind":"Panel","spec":{"display":{"name":"vCPU / 1k rps"},"plugin":{"kind":"TimeSeriesChart","spec":{"legend":{"position":"bottom","mode":"list"},"yAxis":{"format":{"unit":"decimal"}},"visual":{"display":"line","lineWidth":1,"areaOpacity":0.1}}},"queries":[{"kind":"TimeSeriesQuery","spec":{"plugin":{"kind":"PrometheusTimeSeriesQuery","spec":{"datasource":{"kind":"PrometheusDatasource","name":"prometheus"},"query":"  sum(\n    irate(\n      container_cpu_usage_seconds_total{container=\"istio-proxy\",pod=~\"istio-ingressgateway-.*\"}[$__rate_interval]\n    )\n  )\n/\n    round(\n      sum(\n        irate(\n          istio_requests_total{reporter=\"source\",source_workload=\"istio-ingressgateway\"}[$__rate_interval]\n        )\n      ),\n      0.001\n    )\n  /\n    1000","seriesNameFormat":"istio-ingressgateway"}}}},{"kind":"TimeSeriesQuery","spec":{"plugin":{"kind":"PrometheusTimeSeriesQuery"