  \".\",\n  \"destination_workload\",\n  \"destination_workload_namespace\"\n)","seriesNameFormat":"{{ destination_workload}}.{{ destination_workload_namespace }}"}}}},{"kind":"TimeSeriesQuery","spec":{"plugin":{"kind":"PrometheusTimeSeriesQuery","spec":{"datasource":{"kind":"PrometheusDatasource","name":"prometheus"},"query":"label_join(\n  histogram_quantile(\n    0.5,\n    sum by (le, destination_workload, destination_workload_namespace) (\n      rate(istio_request_duration_milliseconds_bucket{reporter=~\"source|waypoint\"}[$__rate_interval])\n    )\n  ),\n  \"destination_workload_var\",\n  \".\",\n  \"destination_workload\",\n  \"destination_workload_namespace\"\n)","seriesNameFormat":"{{ destination_workload}}.{{ destination_workload_namespace }}"}}}},{"kind":"TimeSeriesQuery","spec":{"plugin":{"kind":"PrometheusTimeSeriesQuery","spec":{"datasource":{"kind":"PrometheusDatasource","name":"prometheus"},"query":"label_join(\n  histogram_quantile(\n    0.9,\n    sum by (le, destination_workload, destination_workload_namespace) (\n      rate(istio_request_duration_milliseconds_bucket{reporter=~\"source|waypoint\"}[$__rate_interval])\n    )\n  ),\n  \"destination_workload_var\",\n  \".\",\n  \"destination_workload\",\n  \"destination_workload_namespace\"\n)","seriesNameFormat":"{{ destination_workload}}.{{ destination_workload_namespace }}"}}}},{"kind":"TimeSeriesQuery","spec":{"plugin":{"kind":"PrometheusTimeSeriesQuery","spec":{"datasource":{"kind":"PrometheusDatasource","name":"prometheus"},"query":"label_join(\n  histogram_quantile(\n    0.99,\n    sum by (le, destination_workload, destination_workload_namespace) (\n      rate(istio_request_duration_milliseconds_bucket{reporter=~\"source|waypoint\"}[$__rate_interval])\n    )\n  ),\n  \"destination_workload_var\",\n  \".\",\n  \"destination_workload\",\n  \"destination_workload_namespace\"\n)","seriesNameFormat":"{{ destination_workload}}.{{ destination_workload_namespace }}"}}}},{"kind":"TimeSeriesQuery","spec":{"plugin":{"kind":"PrometheusTimeSeriesQuery","spec":{"datasource":{"kind":"PrometheusDatasource","name":"prometheus"},"query":"label_join(\n    sum by (destination_workload, destination_workload_namespace) (\n      rate(istio_requests_total{reporter=~\"source|waypoint\",response_code!~\"5..\"}[$__rate_interval])\n    )\n  /\n    sum by (destination_workload, destination_workload_namespace) (\n      rate(istio_requests_total{reporter=~\"source|waypoint\"}[$__rate_interval])\n    ),\n  \"destination_workload_var\",\n  \".\",\n  \"destination_workload\",\n  \"destination_workload_namespace\"\n)","seriesNameFormat":"{{ destination_workload}}.{{ destination_workload_namespace }}"}}}}]}},"1_1":{"kind":"Panel","spec":{"display":{"name":"TCP Workloads","description":"Bytes sent and recieived information for TCP services"},"plugin":{"kind":"Table","spec":{"columnSettings":[{"name":"Value #recv","header":"Bytes Received"},{"name":"Value #sent","header":"Bytes Sent"},{"name":"destination_workload_var","header":"Workload"},{"name":"destination_service","header":"Service"},{"name":"destination_workload_namespace"},{"name":"destination_workload"},{"name":"timestamp"}],"transforms":[{"kind":"MergeSeries","spec":{}}]}},"queries":[{"kind":"TimeSeriesQuery","spec":{"plugin":{"kind":"PrometheusTimeSeriesQuery","spec":{"datasource":{"kind":"PrometheusDatasource","name":"prometheus"},"query":"label_join(\n  sum by (destination_workload, destination_workload_namespace, destination_service) (\n    rate(istio_tcp_received_bytes_total{reporter=~\"source|waypoint\"}[$__rate_interval])\n  ),\n  \"destination_workload_var\",\n  \".\",\n  \"destination_workload\",\n  \"destination_workload_namespace\"\n)","seriesNameFormat":"{{ destination_workload}}.{{ destination_workload_namespace }}"}}}},{"kind":"TimeSeriesQuery","spec":{"plugin":{"kind":"PrometheusTimeSeriesQuery","spec":{"datasource":{"kind":"PrometheusDatasource","name":"prometheus"},"query":"label_join(\n  sum by (destination_workload, 